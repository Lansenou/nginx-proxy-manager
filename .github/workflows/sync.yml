name: Sync with upstream
on:
  schedule:
    - cron: '0 0 * * *' # every day
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: develop-crowdsec
          persist-credentials: false
          fetch-depth: 0

      - name: Add upstream
        run: |
          git config --global user.email "gitlab-runner@example.com"
          git config --global user.name "Gitlab Runner"
          git remote add upstream https://github.com/NginxProxyManager/nginx-proxy-manager.git
          git fetch upstream master
          git merge upstream/master --allow-unrelated-histories --no-edit || true

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: develop-crowdsec