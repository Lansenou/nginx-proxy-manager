name: Run Build

on:
  workflow_dispatch:
    inputs: {}
  push:
    branches:
      - develop-crowdsec

jobs:
  jenkins-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_PASS }} | docker login --username ${{ secrets.DOCKER_USER }} --password-stdin
      - name: Create front-end
        run: ./scripts/ci/frontend-build
      - name: Run build
        run: |
          TAG=$GITHUB_REF_NAME
          if [ "$TAG" = "develop-crowdsec" ]; then
            TAG="latest"
          fi

          export BUILD_VERSION="$(< .version)"
          echo "Pushing (version ${BUILD_VERSION}) to image: lansje/nginx-proxy-manager"

          npm --prefix backend version "$BUILD_VERSION" --no-git-tag-version --allow-same-version
          npm --prefix frontend version "$BUILD_VERSION" --no-git-tag-version --allow-same-version

          MAJOR="${BUILD_VERSION%%.*}"
          MINOR="${BUILD_VERSION%.*}"

          TAGS="-t lansje/nginx-proxy-manager:$BUILD_VERSION"
          TAGS="$TAGS -t lansje/nginx-proxy-manager:$MINOR"
          TAGS="$TAGS -t lansje/nginx-proxy-manager:$MAJOR"

          if [ "$TAG" = "latest" ]; then
            TAGS="$TAGS -t lansje/nginx-proxy-manager:latest"
          fi

          ./scripts/buildx --push $TAGS
